[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-radar"
version = "0.1.0"
description = "Lead discovery + scoring pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11",
  "psycopg[binary]>=3.1.19",
  "PyYAML>=6.0.1",
  "python-dateutil>=2.9.0.post0",
  "requests>=2.32.3",
]

[project.scripts]
lead-radar-collector = "lead_radar.collector:main"
lead-radar-publisher = "lead_radar.publisher_server:main"

[tool.setuptools]
packages = ["lead_radar"]
