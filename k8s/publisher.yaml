apiVersion: apps/v1
kind: Deployment
metadata:
  name: lead-radar-publisher
  namespace: lead-radar
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lead-radar-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lead-radar-publisher
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publisher
          image: python:3.12-slim@sha256:ccc7089399c8bb65dd1fb3ed6d55efa538a3f5e7fca3f5988ac3b5b87e593bf0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              export HOME=/tmp
              export PYTHONUSERBASE=/tmp/pythonuserbase
              export PATH="$PYTHONUSERBASE/bin:$PATH"
              pip install --no-cache-dir --user "https://github.com/fedoratechnologies/lead-radar/archive/refs/heads/main.tar.gz"
              exec lead-radar-publisher
          env:
            - name: LEAD_RADAR_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lead-radar-github
                  key: token
            - name: LEAD_RADAR_GITHUB_OWNER
              value: "fedoratechnologies"
            - name: LEAD_RADAR_GITHUB_REPO
              value: "lead-radar-config"
            - name: LEAD_RADAR_GITHUB_BRANCH
              value: "main"
            - name: LEAD_RADAR_GITHUB_PATH
              value: "k8s/lead-radar-configmap.yaml"
            - name: LEAD_RADAR_PUBLISHER_PORT
              value: "8080"
            - name: TZ
              value: "America/Chicago"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: lead-radar-publisher
  namespace: lead-radar
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: lead-radar-publisher
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lead-radar-publisher-ingress
  namespace: lead-radar
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lead-radar-publisher
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: erpnext
      ports:
        - protocol: TCP
          port: 8080
