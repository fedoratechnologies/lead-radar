apiVersion: batch/v1
kind: CronJob
metadata:
  name: lead-radar-collector
  namespace: lead-radar
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: collector
              image: python:3.12-slim@sha256:ccc7089399c8bb65dd1fb3ed6d55efa538a3f5e7fca3f5988ac3b5b87e593bf0
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              command: ["bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  export HOME=/tmp
                  export PYTHONUSERBASE=/tmp/pythonuserbase
                  export PATH="$PYTHONUSERBASE/bin:$PATH"
                  pip install --no-cache-dir --user "https://github.com/fedoratechnologies/lead-radar/archive/refs/heads/main.tar.gz"
                  export LEAD_RADAR_DB_DSN="postgresql://${DB_USERNAME}:${DB_PASSWORD}@lead-radar-cnpg-rw.lead-radar.svc.cluster.local:5432/lead_radar?sslmode=require"
                  export LEAD_RADAR_CONFIG_DIR="/config"
                  export LEAD_RADAR_HUB_BASE_URL="http://hubdirectory-opportunity-api.hubdirectory.svc.cluster.local"
                  lead-radar-collector
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: DB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: lead-radar-cnpg-app
                      key: username
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: lead-radar-cnpg-app
                      key: password
                - name: LEAD_RADAR_HUB_INGEST_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: lead-radar-hubdirectory-ingest
                      key: RADAR_INGEST_SECRET
                      optional: true
                - name: LEAD_RADAR_S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: lead-radar-minio
                      key: endpoint
                - name: LEAD_RADAR_S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lead-radar-minio
                      key: access_key
                - name: LEAD_RADAR_S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lead-radar-minio
                      key: secret_key
                - name: LEAD_RADAR_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: lead-radar-minio
                      key: bucket
                - name: LEAD_RADAR_S3_PREFIX
                  valueFrom:
                    secretKeyRef:
                      name: lead-radar-minio
                      key: prefix
                - name: LEAD_RADAR_S3_SECURE
                  valueFrom:
                    secretKeyRef:
                      name: lead-radar-minio
                      key: secure
                - name: LEAD_RADAR_USER_AGENT
                  value: "lead-radar/0.1 (+https://github.com/fedoratechnologies/lead-radar)"
                - name: TZ
                  value: "America/Chicago"
                - name: LEAD_RADAR_HUB_MIN_SCORE
                  value: "0"
                - name: LEAD_RADAR_HUB_MAX_ORGS
                  value: "5000"
                - name: LEAD_RADAR_HUB_BATCH_SIZE
                  value: "100"
                - name: LEAD_RADAR_HUB_SIGNAL_LIMIT
                  value: "8"
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: lead-radar-config
